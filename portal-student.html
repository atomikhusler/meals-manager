<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <script>
        window.onerror = function(msg, url, line) {
            console.error("CRASH LOG: " + msg + "\nLine: " + line);
            return false;
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Student Portal - Mess Manager</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: {} } }
    </script>
    
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        * { -webkit-tap-highlight-color: transparent; }
        
        /* Custom toggle transitions */
        .toggle-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#0a0a0a] text-gray-900 dark:text-gray-100 transition-colors duration-200 antialiased opacity-0" id="app-body">
    
    <div class="flex flex-col h-dvh max-w-md mx-auto relative overflow-hidden bg-white dark:bg-black md:border-x md:border-gray-200 dark:md:border-gray-900 shadow-2xl">
        
        <!-- HEADER -->
        <header class="px-6 pt-12 pb-4 flex justify-between items-center bg-white dark:bg-black z-10">
            <div>
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest" id="date-display">Today</p>
                <h1 class="text-2xl font-black tracking-tight text-gray-900 dark:text-white mt-1" id="student-greeting">Hi, Student</h1>
            </div>
            
            <button id="btn-logout" class="p-2.5 bg-gray-50 dark:bg-[#111] rounded-full text-red-500 active:scale-90 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto px-6 pb-10 space-y-6">
            
            <!-- LIVE DEADLINE ENGINE -->
            <div class="bg-blue-600 rounded-3xl p-5 shadow-lg shadow-blue-600/20 text-white relative overflow-hidden fade-in">
                <!-- Decorative background elements -->
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
                
                <div class="relative z-10 flex justify-between items-center">
                    <div>
                        <h2 class="text-[10px] font-black text-blue-200 uppercase tracking-widest">Next Cutoff In</h2>
                        <div class="text-3xl font-black tracking-tighter mt-1 tabular-nums" id="countdown-clock">--:--:--</div>
                        <p class="text-xs font-semibold text-blue-100 mt-1" id="countdown-label">Waiting for server...</p>
                    </div>
                    <div class="h-12 w-12 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-md">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    </div>
                </div>
            </div>

            <!-- MEAL TOGGLES -->
            <div class="space-y-4 fade-in" style="animation-delay: 0.1s;">
                
                <!-- DAY MEAL CARD -->
                <div class="bg-gray-50 dark:bg-[#111] p-5 rounded-3xl border border-gray-100 dark:border-gray-900">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-2.5">
                            <div class="h-8 w-8 bg-amber-100 dark:bg-amber-900/30 text-amber-500 rounded-full flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>
                            </div>
                            <h3 class="font-black text-gray-900 dark:text-white">Day Meal</h3>
                        </div>
                        <span id="day-status-badge" class="bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider">Active</span>
                    </div>

                    <!-- Segmented Control -->
                    <div class="flex bg-gray-200/50 dark:bg-black p-1.5 rounded-2xl gap-1">
                        <button class="toggle-btn flex-1 py-3 text-sm font-bold rounded-xl text-gray-500 hover:text-gray-900 dark:hover:text-white" data-meal="day" data-val="OFF">Off</button>
                        <button class="toggle-btn flex-1 py-3 text-sm font-bold rounded-xl text-gray-500 hover:text-gray-900 dark:hover:text-white" data-meal="day" data-val="NO_RICE">No Rice</button>
                        <button class="toggle-btn flex-1 py-3 text-sm font-bold rounded-xl bg-white dark:bg-[#1a1a1c] text-gray-900 dark:text-white shadow-sm border border-gray-100 dark:border-gray-800" data-meal="day" data-val="RICE">Rice</button>
                    </div>
                </div>

                <!-- NIGHT MEAL CARD -->
                <div class="bg-gray-50 dark:bg-[#111] p-5 rounded-3xl border border-gray-100 dark:border-gray-900">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-2.5">
                            <div class="h-8 w-8 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-500 rounded-full flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                            </div>
                            <h3 class="font-black text-gray-900 dark:text-white">Night Meal</h3>
                        </div>
                        <span id="night-status-badge" class="bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider">Active</span>
                    </div>

                    <div class="flex bg-gray-200/50 dark:bg-black p-1.5 rounded-2xl gap-1">
                        <button class="toggle-btn flex-1 py-3 text-sm font-bold rounded-xl text-gray-500 hover:text-gray-900 dark:hover:text-white" data-meal="night" data-val="OFF">Off</button>
                        <button class="toggle-btn flex-1 py-3 text-sm font-bold rounded-xl text-gray-500 hover:text-gray-900 dark:hover:text-white" data-meal="night" data-val="NO_RICE">No Rice</button>
                        <button class="toggle-btn flex-1 py-3 text-sm font-bold rounded-xl bg-white dark:bg-[#1a1a1c] text-gray-900 dark:text-white shadow-sm border border-gray-100 dark:border-gray-800" data-meal="night" data-val="RICE">Rice</button>
                    </div>
                </div>

            </div>

            <!-- BALANCES DASHBOARD -->
            <div class="grid grid-cols-2 gap-4 pt-2 fade-in" style="animation-delay: 0.2s;">
                <div class="bg-white dark:bg-black border-2 border-gray-100 dark:border-gray-900 p-5 rounded-3xl">
                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Cash Balance</div>
                    <div class="text-xl font-black text-gray-900 dark:text-white" id="cash-balance">₹--</div>
                </div>
                
                <div class="bg-white dark:bg-black border-2 border-gray-100 dark:border-gray-900 p-5 rounded-3xl">
                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1" id="rice-unit-label">Rice Balance</div>
                    <div class="text-xl font-black text-gray-900 dark:text-white" id="rice-balance">--</div>
                </div>
            </div>

        </main>
        
        <!-- Toast Container -->
        <div id="toast-container" class="absolute bottom-5 left-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
    </div>

    <script>
        // ==========================================
        const SUPABASE_URL = "https://usazhtrcafnsylffrhhv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzYXpodHJjYWZuc3lsZmZyaGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNzUyMTYsImV4cCI6MjEwMzk1MTIxNn0.KPAfz21-QfmaK5VOSqVXpkUBT7LujNQjsW85HTsqRhI";
        // ==========================================
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Security Guard
        async function authenticateStudent() {
            try {
                const { data, error } = await supabase.auth.getSession();
                if (!data?.session) throw new Error("No session");

                const { data: profile } = await supabase.from('profiles').select('role, name').eq('user_id', data.session.user.id).single();
                
                if (profile?.role !== 'STUDENT') {
                    window.location.replace('index.html');
                } else {
                    document.getElementById('student-greeting').innerText = `Hi, ${profile.name.split(' ')[0]}`;
                    document.getElementById('app-body').style.opacity = '1';
                    
                    // Call data loaders here in the future
                    // loadStudentData(); 
                }
            } catch (err) {
                window.location.replace('index.html');
            }
        }

        authenticateStudent();

        // UI Date Setup
        const dateOptions = { weekday: 'long', month: 'short', day: 'numeric' };
        document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-US', dateOptions);

        // Toast Engine
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `${type === 'success' ? 'bg-gray-900 dark:bg-white text-white dark:text-black' : 'bg-red-500 text-white'} px-6 py-3.5 rounded-2xl shadow-2xl font-bold text-sm fade-in transition-all text-center`;
            toast.innerText = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                setTimeout(() => toast.remove(), 300); 
            }, 2500);
        }

        // Segmented Control Logic (UI visual updates)
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.currentTarget;
                const mealType = target.getAttribute('data-meal');
                const value = target.getAttribute('data-val');

                // 1. Check if deadline has passed (Mocking check for now)
                const isLocked = false; 
                if (isLocked) {
                    return showToast("Deadline passed. Cannot update meal.", "error");
                }

                // 2. Reset sibling styles
                const siblings = target.parentElement.querySelectorAll('.toggle-btn');
                siblings.forEach(sib => {
                    sib.classList.remove('bg-white', 'dark:bg-[#1a1a1c]', 'text-gray-900', 'dark:text-white', 'shadow-sm', 'border', 'border-gray-100', 'dark:border-gray-800');
                    sib.classList.add('text-gray-500');
                });

                // 3. Apply active styles to clicked button
                target.classList.remove('text-gray-500');
                target.classList.add('bg-white', 'dark:bg-[#1a1a1c]', 'text-gray-900', 'dark:text-white', 'shadow-sm', 'border', 'border-gray-100', 'dark:border-gray-800');

                // 4. Update Database (Future implementation)
                showToast(`Updated to ${value.replace('_', ' ')}`);
            });
        });

        // Logout
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.replace('index.html');
        });

    </script>
</body>
</html>
