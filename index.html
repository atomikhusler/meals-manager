<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <!-- The Bug Hunter -->
    <script>
        window.onerror = function(msg, url, line) {
            alert("CRASH LOG: " + msg + "\nLine: " + line);
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            alert("PROMISE CRASH: " + (event.reason ? event.reason.message || event.reason : "Unknown Error"));
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mess Manager - Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: {} } }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#0a0a0a] text-gray-900 dark:text-gray-100 transition-colors duration-200 antialiased overflow-hidden">
    
    <!-- 1. SPLASH SCREEN BOOTLOADER -->
    <div id="splash-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white dark:bg-black transition-opacity duration-500">
        <div class="text-6xl font-black tracking-tighter text-blue-600 dark:text-blue-500 animate-pulse">MM</div>
        <div class="mt-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Mess Manager</div>
        <div id="boot-status" class="mt-8 text-[10px] font-bold text-gray-400 uppercase tracking-widest animate-pulse">Authenticating...</div>
    </div>

    <!-- 2. UNIFIED AUTHENTICATION GATE -->
    <div id="auth-container" class="hidden inset-0 z-[90] flex-col items-center justify-center px-4 h-dvh fade-in">
        
        <div class="w-full max-w-sm bg-white dark:bg-[#111] p-8 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-2xl relative overflow-hidden">
            
            <!-- STUDENT LOGIN VIEW (Default) -->
            <div id="view-student-login" class="transition-all duration-300">
                <div class="text-center mb-6">
                    <div class="text-3xl font-black text-gray-900 dark:text-white tracking-tight mb-1">Student Login</div>
                    <div class="text-xs text-gray-500 font-medium">Enter details provided by your manager</div>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">Mess Code</label>
                        <input type="text" id="student-mess-code" placeholder="6-Character Code" class="w-full mt-1 bg-gray-50 dark:bg-[#1a1a1c] text-sm font-bold text-gray-900 dark:text-white outline-none border border-gray-100 dark:border-gray-800 rounded-xl px-4 py-3.5 focus:border-blue-500 uppercase transition-colors">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">Mobile Number</label>
                        <input type="tel" id="student-phone" placeholder="10-digit number" class="w-full mt-1 bg-gray-50 dark:bg-[#1a1a1c] text-sm font-bold text-gray-900 dark:text-white outline-none border border-gray-100 dark:border-gray-800 rounded-xl px-4 py-3.5 focus:border-blue-500 transition-colors">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">4-Digit PIN</label>
                        <input type="password" id="student-pin" placeholder="••••" maxlength="4" class="w-full mt-1 bg-gray-50 dark:bg-[#1a1a1c] text-center tracking-[0.5em] text-lg font-black text-gray-900 dark:text-white outline-none border border-gray-100 dark:border-gray-800 rounded-xl px-4 py-3.5 focus:border-blue-500 transition-colors">
                    </div>
                    
                    <div class="pt-2">
                        <button id="btn-student-login" class="w-full flex justify-center items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-black text-sm py-4 rounded-xl active:scale-95 transition-all shadow-lg shadow-blue-600/20">
                            Login securely
                        </button>
                    </div>
                </div>
            </div>

            <!-- MANAGER ACTIVATION VIEW (Hidden by default) -->
            <div id="view-manager-activation" class="hidden transition-all duration-300">
                <div class="text-center mb-6">
                    <div class="text-3xl font-black text-gray-900 dark:text-white tracking-tight mb-1">Activate</div>
                    <div class="text-xs text-gray-500 font-medium">Register device to unlock Manager Portal</div>
                </div>
                
                <div class="space-y-4">
                    <!-- Hardware ID injected here by auth.js -->
                    <div id="did-ref-container" class="text-center py-1 mb-2 font-mono text-xs text-gray-400 dark:text-gray-500"></div>

                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">Manager Name</label>
                        <input type="text" id="auth-name" placeholder="Enter your name" class="w-full mt-1 bg-gray-50 dark:bg-[#1a1a1c] text-sm font-bold text-gray-900 dark:text-white outline-none border border-gray-100 dark:border-gray-800 rounded-xl px-4 py-3.5 focus:border-blue-500 transition-colors">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">Mobile Number</label>
                        <input type="tel" id="auth-phone" placeholder="10-digit number" class="w-full mt-1 bg-gray-50 dark:bg-[#1a1a1c] text-sm font-bold text-gray-900 dark:text-white outline-none border border-gray-100 dark:border-gray-800 rounded-xl px-4 py-3.5 focus:border-blue-500 transition-colors">
                    </div>
                    
                    <div class="pt-2">
                        <button id="btn-request-key" class="w-full flex justify-center items-center gap-2 bg-gray-900 dark:bg-white text-white dark:text-black font-black text-sm py-4 rounded-xl active:scale-95 transition-all">
                            Request Activation
                        </button>
                        <div id="auth-status-text" class="hidden text-center mt-3 text-[10px] font-bold text-blue-500 animate-pulse">
                            Listening for admin approval... Leave app open.
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- View Toggles -->
        <button id="toggle-to-manager" class="mt-8 text-xs font-bold text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors">
            Are you a Mess Manager? Activate Device
        </button>
        <button id="toggle-to-student" class="hidden mt-8 text-xs font-bold text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors">
            Return to Student Login
        </button>

    </div>

    <!-- UI View Switcher Script (Auth Logic resides in app.js/auth.js) -->
    <script>
        const viewStudent = document.getElementById('view-student-login');
        const viewManager = document.getElementById('view-manager-activation');
        const btnToManager = document.getElementById('toggle-to-manager');
        const btnToStudent = document.getElementById('toggle-to-student');

        btnToManager.addEventListener('click', () => {
            viewStudent.classList.add('hidden');
            btnToManager.classList.add('hidden');
            viewManager.classList.remove('hidden');
            btnToStudent.classList.remove('hidden');
        });

        btnToStudent.addEventListener('click', () => {
            viewManager.classList.add('hidden');
            btnToStudent.classList.add('hidden');
            viewStudent.classList.remove('hidden');
            btnToManager.classList.remove('hidden');
        });
    </script>

    <!-- Connects to your modular architecture -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
