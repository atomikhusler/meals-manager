<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mess Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: {} } }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-white dark:bg-black text-gray-900 dark:text-gray-100 transition-colors duration-200 selection:bg-blue-200 antialiased overflow-hidden">
    
    <!-- 1. SPLASH SCREEN BOOTLOADER -->
    <div id="splash-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white dark:bg-black transition-opacity duration-500">
        <div class="text-6xl font-black tracking-tighter text-blue-600 dark:text-blue-500 animate-pulse">MM</div>
        <div class="mt-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Mess Manager</div>
    </div>

    <!-- 2. ACTIVATION GATE (ntfy.sh Serverless Lock) -->
    <div id="activation-gate" class="fixed inset-0 z-[90] hidden flex-col items-center justify-center bg-gray-50 dark:bg-[#0a0a0a] transition-opacity duration-500 px-4">
        
        <div class="w-full max-w-sm bg-white dark:bg-[#111] p-6 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-2xl">
            <div class="text-center mb-6">
                <div class="text-3xl font-black text-gray-900 dark:text-white tracking-tight mb-1">Activate</div>
                <div class="text-xs text-gray-500">Register your device to unlock the app.</div>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">Admin Name</label>
                    <input type="text" id="auth-name" placeholder="Enter your name" class="w-full mt-1 bg-gray-50 dark:bg-[#1a1a1c] text-sm font-bold text-gray-900 dark:text-white outline-none border border-gray-100 dark:border-gray-800 rounded-xl px-4 py-3.5 focus:border-blue-500 transition-colors">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">Mobile Number</label>
                    <input type="tel" id="auth-phone" placeholder="10-digit number" class="w-full mt-1 bg-gray-50 dark:bg-[#1a1a1c] text-sm font-bold text-gray-900 dark:text-white outline-none border border-gray-100 dark:border-gray-800 rounded-xl px-4 py-3.5 focus:border-blue-500 transition-colors">
                </div>
                
                <div class="pt-2">
                    <button id="btn-request-key" class="w-full flex justify-center items-center gap-2 bg-gray-900 dark:bg-white text-white dark:text-black font-black text-sm py-4 rounded-xl active:scale-95 transition-all">
                        Request Activation Key
                    </button>
                    <div id="auth-status-text" class="hidden text-center mt-3 text-[10px] font-bold text-blue-500 animate-pulse">
                        Listening for server response... Leave app open.
                    </div>
                </div>
                
                <div class="border-t border-gray-100 dark:border-gray-800 pt-6 mt-4 relative">
                    <span class="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-white dark:bg-[#111] px-2 text-[9px] font-bold text-gray-400 uppercase tracking-widest">Manual Fallback</span>
                    <input type="text" id="auth-key" placeholder="Enter 6-digit key (e.g. A7X-9P2)" class="w-full text-center bg-transparent text-sm font-bold text-blue-600 dark:text-blue-400 outline-none border border-gray-200 dark:border-gray-700 border-dashed rounded-xl px-4 py-3.5 uppercase placeholder-gray-400 mb-3">
                    <button id="btn-verify-key" class="w-full bg-blue-600 text-white font-black text-sm py-3.5 rounded-xl active:scale-95 transition-transform">
                        Unlock App
                    </button>
                </div>
            </div>
        </div>

        <!-- Telegram Emergency Support Link -->
        <button id="btn-tg-support" class="mt-8 flex items-center gap-2 text-xs font-bold text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            Having trouble? Join Telegram Support
        </button>
    </div>

    <!-- MAIN APP SHELL -->
    <div class="flex h-dvh w-full">
        <!-- DESKTOP SIDEBAR -->
        <aside class="hidden md:flex flex-col w-64 bg-gray-50 dark:bg-[#0a0a0a] border-r border-gray-200 dark:border-gray-900 z-20 transition-colors">
            <div class="p-6">
                <h1 class="text-xl font-bold tracking-tight">Mess Manager</h1>
            </div>
            <nav class="flex-1 flex flex-col px-3 gap-1">
                <button class="nav-btn-desktop active text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors" data-target="view-attendance">Attendance</button>
                <button class="nav-btn-desktop text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors" data-target="view-summary">Summary</button>
                <button class="nav-btn-desktop text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors" data-target="view-directory">Directory</button>
                <button class="nav-btn-desktop text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors" data-target="view-settings">Admin Tools</button>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="flex-1 flex flex-col h-dvh relative overflow-hidden">
            <!-- iOS Style Header -->
            <header class="bg-white/80 dark:bg-black/80 backdrop-blur-xl px-4 py-3 flex justify-between items-center z-10 sticky top-0 border-b border-gray-100 dark:border-gray-900 transition-colors print:hidden">
                <div class="md:hidden">
                    <h1 class="text-lg font-bold tracking-tight" id="header-view-title-mobile">Attendance</h1>
                </div>
                <div class="hidden md:block font-bold text-gray-400 dark:text-gray-500" id="header-view-title">Attendance</div>
                
                <button id="btn-theme-toggle" class="p-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white active:scale-95 transition-all">
                    <!-- SVG Moon -->
                    <svg id="theme-icon-dark" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    <!-- SVG Sun -->
                    <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>
                </button>
            </header>

            <!-- SCROLLABLE VIEWPORT (pb-28 fixes the Z-index bottom cutoff bug) -->
            <main id="app-content" class="flex-1 overflow-y-auto w-full max-w-3xl mx-auto pb-28 md:pb-10 pt-4">

                <!-- VIEW 1: ATTENDANCE -->
                <section id="view-attendance" class="view-section">
                    <div id="date-hero-container" class="px-4 mb-6"></div>
                    <div id="attendance-list" class="border-y border-gray-100 dark:border-gray-900 divide-y divide-gray-100 dark:divide-gray-900"></div>
                </section>

                <!-- VIEW 2: SUMMARY -->
                <section id="view-summary" class="view-section hidden-view">
                    <div id="summary-header-container" class="px-4 mb-6"></div>
                    <div id="summary-list" class="border-y border-gray-100 dark:border-gray-900 divide-y divide-gray-100 dark:divide-gray-900"></div>
                </section>

                <!-- VIEW 3: DIRECTORY -->
                <section id="view-directory" class="view-section hidden-view print:hidden">
                    <div class="px-4 mb-4 flex justify-end">
                        <button id="btn-show-add-form" class="text-sm font-bold text-blue-600 dark:text-blue-500 active:opacity-50 transition-opacity flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                            Add Member
                        </button>
                    </div>
                    <div id="directory-form-container"></div>
                    <h2 class="px-4 text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 mt-4">Active Roster</h2>
                    <div id="directory-list" class="border-y border-gray-100 dark:border-gray-900 divide-y divide-gray-100 dark:divide-gray-900"></div>
                </section>

                <!-- VIEW 4: ADMIN TOOLS -->
                <section id="view-settings" class="view-section hidden-view print:hidden pt-2">
                    <h2 class="px-4 text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Reports</h2>
                    <div class="border-y border-gray-100 dark:border-gray-900 mb-8 divide-y divide-gray-100 dark:divide-gray-900">
                        <button id="btn-export-csv" class="w-full flex items-center justify-between px-4 py-3.5 bg-white dark:bg-black active:bg-gray-50 dark:active:bg-[#0a0a0a] transition-colors">
                            <span class="text-sm font-medium">Download Excel</span>
                            <svg class="text-gray-400" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        </button>
                        <button id="btn-print" class="w-full flex items-center justify-between px-4 py-3.5 bg-white dark:bg-black active:bg-gray-50 dark:active:bg-[#0a0a0a] transition-colors">
                            <span class="text-sm font-medium">Print PDF Matrix</span>
                            <svg class="text-gray-400" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
                        </button>
                    </div>

                    <h2 class="px-4 text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Data Management</h2>
                    <div class="border-y border-gray-100 dark:border-gray-900 mb-8 divide-y divide-gray-100 dark:divide-gray-900">
                        <button id="btn-backup-json" class="w-full flex items-center justify-between px-4 py-3.5 bg-white dark:bg-black active:bg-gray-50 dark:active:bg-[#0a0a0a] transition-colors">
                            <span class="text-sm font-medium">Export Handover File</span>
                            <svg class="text-gray-400" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                        </button>
                        <div class="relative w-full flex items-center justify-between px-4 py-3.5 bg-white dark:bg-black active:bg-gray-50 dark:active:bg-[#0a0a0a] transition-colors cursor-pointer">
                            <span class="text-sm font-medium">Import Handover File</span>
                            <svg class="text-gray-400" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                            <input type="file" id="file-restore" accept=".json" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        </div>
                    </div>

                    <h2 class="px-4 text-[11px] font-bold text-red-500 uppercase tracking-wider mb-2">Danger Zone</h2>
                    <div class="border-y border-red-100 dark:border-red-900/30 mb-8">
                        <button id="btn-factory-reset" class="w-full flex items-center justify-between px-4 py-3.5 bg-white dark:bg-black active:bg-red-50 dark:active:bg-red-900/10 transition-colors">
                            <span class="text-sm font-medium text-red-600 dark:text-red-500">Factory Reset App</span>
                            <svg class="text-red-500" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
                        </button>
                    </div>
                </section>
            </main>

            <!-- MOBILE BOTTOM NAV -->
            <nav class="md:hidden fixed bottom-0 w-full bg-white/90 dark:bg-black/90 backdrop-blur-xl border-t border-gray-100 dark:border-gray-900 flex justify-around pb-safe z-50">
                <button class="nav-btn-mobile active flex flex-col items-center justify-center w-1/4 py-2.5 text-gray-900 dark:text-white transition-colors" data-target="view-attendance">
                    <svg class="nav-icon mb-1 stroke-[2.5px]" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                    <span class="text-[10px] font-semibold">Daily</span>
                </button>
                <button class="nav-btn-mobile flex flex-col items-center justify-center w-1/4 py-2.5 text-gray-400 dark:text-gray-600 transition-colors" data-target="view-summary">
                    <svg class="nav-icon mb-1 stroke-2" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                    <span class="text-[10px] font-semibold">Summary</span>
                </button>
                <button class="nav-btn-mobile flex flex-col items-center justify-center w-1/4 py-2.5 text-gray-400 dark:text-gray-600 transition-colors" data-target="view-directory">
                    <svg class="nav-icon mb-1 stroke-2" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span class="text-[10px] font-semibold">Directory</span>
                </button>
                <button class="nav-btn-mobile flex flex-col items-center justify-center w-1/4 py-2.5 text-gray-400 dark:text-gray-600 transition-colors" data-target="view-settings">
                    <svg class="nav-icon mb-1 stroke-2" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 1.94l-.15 1.16C9.25 5.56 8.9 5.9 8.5 6.13l-1.12-.34a2 2 0 0 0-2.31.7l-1.3 2.27a2 2 0 0 0 .34 2.45l.93.93c-.02.2-.04.41-.04.62s.02.42.04.62l-.93.93a2 2 0 0 0-.34 2.45l1.3 2.27a2 2 0 0 0 2.31.7l1.12-.34c.4.23.75.57 1.13.78l.15 1.16a2 2 0 0 0 2 1.94h.44a2 2 0 0 0 2-1.94l.15-1.16c.38-.21.73-.55 1.13-.78l1.12.34a2 2 0 0 0 2.31-.7l1.3-2.27a2 2 0 0 0-.34-2.45l-.93-.93c.02-.2.04-.41.04-.62s-.02-.42-.04-.62l.93-.93a2 2 0 0 0 .34-2.45l-1.3-2.27a2 2 0 0 0-2.31-.7l-1.12.34c-.4-.23-.75-.57-1.13-.78l-.15-1.16A2 2 0 0 0 12.22 2z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span class="text-[10px] font-semibold">Tools</span>
                </button>
            </nav>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
